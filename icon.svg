<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- 角丸背景 -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- カレンダー本体 -->
  <rect x="96" y="120" width="320" height="296" rx="24" ry="24" fill="#ffffff"/>
  <!-- ヘッダ帯 -->
  <rect x="96" y="120" width="320" height="64" rx="24" ry="24" fill="#dc2626"/>
  <rect x="96" y="160" width="320" height="24" fill="#dc2626"/>
  <!-- リング -->
  <rect x="160" y="88" width="20" height="64" rx="6" ry="6" fill="#1e3a8a"/>
  <rect x="332" y="88" width="20" height="64" rx="6" ry="6" fill="#1e3a8a"/>
  <!-- 日付グリッド (3x3 簡略) -->
  <g fill="#cbd5e1">
    <rect x="128" y="208" width="56" height="40" rx="4"/>
    <rect x="200" y="208" width="56" height="40" rx="4"/>
    <rect x="272" y="208" width="56" height="40" rx="4"/>
    <rect x="344" y="208" width="40" height="40" rx="4"/>
    <rect x="128" y="260" width="56" height="40" rx="4"/>
    <rect x="200" y="260" width="56" height="40" rx="4" fill="#2563eb"/>
    <rect x="272" y="260" width="56" height="40" rx="4"/>
    <rect x="344" y="260" width="40" height="40" rx="4"/>
    <rect x="128" y="312" width="56" height="40" rx="4"/>
    <rect x="200" y="312" width="56" height="40" rx="4"/>
    <rect x="272" y="312" width="56" height="40" rx="4"/>
    <rect x="344" y="312" width="40" height="40" rx="4"/>
  </g>
  <!-- 中央"今日"マーカー -->
  <text x="228" y="290" font-family="-apple-system,sans-serif" font-size="26" font-weight="900" fill="#ffffff">今</text>
</svg>
